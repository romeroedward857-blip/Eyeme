name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            build-essential autoconf automake libtool libtool-bin \
            pkg-config gettext libltdl-dev libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake

      - name: Prepare Autotools
        run: |
          set -eux
          autoreconf --version
          autoconf --version
          automake --version
          libtoolize --version
          sudo libtoolize --force --copy

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.37" "buildozer==1.5.0"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Verify Android SDK
        run: |
          set -eux
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          command -v sdkmanager
          sdkmanager --version
          command -v adb
          adb version
          test -d "${ANDROID_SDK_ROOT}/platforms/android-35"
          test -d "${ANDROID_SDK_ROOT}/build-tools/35.0.0"

      - name: Show project files
        run: |
          echo "===== PROJECT ====="
          find . -maxdepth 3 -type f | sort

      - name: Check Buildozer spec
        run: |
          test -f buildozer.spec
          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer bin
          mkdir -p bin

      - name: Build APK
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -eux
          buildozer android clean || true
          buildozer -v android debug

      - name: Find APK
        if: success()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print
          test -n "$(find bin -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Eyeme-APK
          path: bin/*.apk
          if-no-files-found: error
