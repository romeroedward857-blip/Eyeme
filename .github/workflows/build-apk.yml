- name: Install Android SDK packages
  shell: bash
  run: |
    set -e

    export ANDROID_HOME="${ANDROID_SDK_ROOT}"
    export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/tools/bin:${PATH}"

    echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
    echo "ANDROID_HOME=${ANDROID_HOME}"

    echo "Buscando sdkmanager..."
    find "${ANDROID_SDK_ROOT}" -type f -name sdkmanager -print

    SDKMANAGER="$(find "${ANDROID_SDK_ROOT}" -type f -name sdkmanager -print -quit)"

    if [ -z "${SDKMANAGER}" ]; then
      echo "ERROR: sdkmanager no encontrado"
      exit 1
    fi

    echo "sdkmanager encontrado en: ${SDKMANAGER}"

    chmod +x "${SDKMANAGER}"

    yes | "${SDKMANAGER}" --licenses || true

    "${SDKMANAGER}" \
      "platform-tools" \
      "platforms;android-33" \
      "build-tools;33.0.2"
